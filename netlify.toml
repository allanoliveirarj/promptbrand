# Configuração de deploy do site da Habitaut no Netlify.
# Site estático puro: não há etapa de build, o Netlify só publica a pasta.

[build]
  publish = "."
  command = ""

# O HTML precisa ser sempre revalidado, senão uma alteração de conteúdo
# demora a aparecer para quem já visitou o site.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS, JS e imagens têm nome fixo; um ano de cache é seguro desde que o
# nome do arquivo mude quando o conteúdo mudar.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
